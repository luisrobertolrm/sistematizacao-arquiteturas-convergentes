services:
  postgres:
    image: postgres:18.3@sha256:a9abf4275f9e99bff8e6aed712b3b7dfec9cac1341bba01c1ffdfce9ff9fc34a
    environment:
      POSTGRES_USER: redesolidaria
      POSTGRES_DB: redesolidaria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env da raiz}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - redesolidaria-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redesolidaria -d redesolidaria"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redesolidaria-postgres:

name: Deploy redesolidaria
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync e build
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git' \
            "$GITHUB_WORKSPACE/" /DATA/sistematizacao-arquiteturas-convergentes/
          cd /DATA/sistematizacao-arquiteturas-convergentes
          docker compose up -d --build
          docker image prune -f
